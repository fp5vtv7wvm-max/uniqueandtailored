<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Order | Unique & Tailored</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
      .qr-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .qr { background: #1a1a1a; padding: 5px; border-radius: 8px; text-align: center; }
    .qr img { width: 60px; height: 60px; border-radius: 4px; }
    .qr p { font-size: 8.1px; margin-top: 3px; font-weight: bold; }
    body { font-family: 'Poppins', sans-serif; background: #050505; color: white; margin: 0; padding-bottom: 100px; }
    .form-container { max-width: 600px; margin: 60px auto; padding: 20px; }
    h1 { font-family: 'Playfair Display', serif; color: #ff69b4; text-align: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; color: #ff69b4; font-size: 12px; text-transform: uppercase; margin-bottom: 8px; }
    input, select { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: white; box-sizing: border-box; }
    .hidden { display: none !important; }
    .btn-submit { width: 100%; background: #ff69b4; border: none; padding: 18px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .total-box { font-size: 24px; color: #4CAF50; text-align: center; margin: 20px 0; font-weight: bold; }
    .payment-area { text-align: center; display: none; }
    .qr-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .qr-box img { width: 150px; border: 3px solid #ff69b4; }
  </style>
</head>
<body>
<div class="form-container">
  <div id="form-ui">
    <h1>Finalize Order</h1>
    <div id="productSummary" class="hidden" style="text-align:center; margin-bottom: 20px;">
  <img id="displayImage" src="" alt="Product" style="width:150px; border-radius:10px; border:2px solid #ff69b4;">
  <h2 id="displayName" style="color:white; margin: 10px 0;"></h2>
</div>
    <form id="orderForm">
      <input type="hidden" name="access_key" value="e8034fbc-90eb-4224-aa25-70c2cc28425b">
      <input type="hidden" name="Product_Name" id="productName">
      <input type="hidden" name="Total_Price" id="totalHidden">
      <div class="form-group"><label>Your Name</label><input type="text" name="Name" required></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" name="Phone" required></div>
      <div id="productOrderingSection" class="hidden">
        <div class="form-group"><label>Quantity</label><input type="number" name="Quantity" id="qty" value="1" min="1" oninput="calculateTotal()"></div>
        <div class="form-group"><label>Shipping or Pickup?</label><select name="Delivery_Preference" id="deliveryOption" onchange="calculateTotal()"><option value="pickup">Pickup</option><option value="delivery">Delivery (+$10.00)</option></select></div>
        <div class="form-group hidden" id="addressGroup"><label>Delivery Address</label><input type="text" name="Address"></div>
        <div class="total-box" id="totalDisplay">$0.00</div>
      </div>
      <div class="form-group"><label>Payment Method</label><select name="Payment_Method"><option value="CashApp">Cash App</option><option value="Venmo">Venmo</option><option value="Cash">Cash (In-person)</option></select></div>
      <button type="submit" class="btn-submit" id="submit-btn">Complete Order</button>
    </form>
    <a href="index.html" style="display:block; margin-top:30px; color:#ff69b4;">Return Home</a>

  </div>
  <div id="success-ui" class="payment-area">
    <h1 style="color: #4CAF50;">Order Received! 🎉</h1>
    <p>Please secure your order via Cash App, Venmo, or cash (expected upon arival).</p>
    <div class="qr-grid">
       <div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://cash.app/$MichelleOrtiz16" alt="C"><p>CASH APP</p></div>
   <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://venmo.com/u/Michelle_Ortiz16" alt="Venmo">
    <p>VENMO</p>
  </div>
   <div class="qr">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://paypal.me/Michelleortiz16" alt="Paypal">
    <p>PayPal</p>
  </div>
  
    </div>
    <p><strong>IMPORTANT:</strong> Use your order name in the "For" line on the app!</p>
    <a href="products.html" style="color:#ff69b4;">Back to Products</a>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const prodName = urlParams.get('product');
  const pricePerUnit = parseFloat(urlParams.get('price') || 0);
  const imgUrl = urlParams.get('image'); // Get the image from URL

  if (prodName) {
    // Show the summary section
    document.getElementById('productSummary').classList.remove('hidden');
    document.getElementById('displayName').innerText = prodName;
    document.getElementById('displayImage').src = imgUrl; // Set the image source
    
    // Show the order fields
    document.getElementById('productOrderingSection').classList.remove('hidden');
    document.getElementById('productName').value = prodName;
    calculateTotal();
  }
 
  function calculateTotal() {
    const qty = parseInt(document.getElementById('qty').value) || 0;
    const isDelivery = document.getElementById('deliveryOption').value === 'delivery';
    document.getElementById('addressGroup').classList.toggle('hidden', !isDelivery);
    let total = (pricePerUnit * qty) + (isDelivery ? 10 : 0);
    document.getElementById('totalDisplay').innerText = "Total: $" + total.toFixed(2);
    document.getElementById('totalHidden').value = total.toFixed(2);
  }

  document.getElementById('orderForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.innerText = "Processing...";
    const res = await fetch("https://api.web3forms.com/submit", { method: "POST", body: new FormData(e.target) });
    if (res.ok) {
      document.getElementById('form-ui').style.display = 'none';
      document.getElementById('success-ui').style.display = 'block';
    } else {
      alert("Something went wrong. Please try again.");
      btn.innerText = "Complete Order";
    }
  };
</script>
</body>
</html>
