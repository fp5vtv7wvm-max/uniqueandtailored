<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Form | Unique & Tailored</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #050505; color: white; margin: 0; padding-bottom: 100px; }
    .navbar { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,105,180,0.2); }
    .logo { font-family: 'Playfair Display', serif; color: #ff69b4; text-decoration: none; font-size: 22px; }
    .form-container { max-width: 600px; margin: 60px auto; padding: 20px; }
    h1 { font-family: 'Playfair Display', serif; color: #ff69b4; font-size: 40px; text-align: center; margin-bottom: 10px; }
    .form-group { margin-bottom: 25px; }
    label { display: block; color: #ff69b4; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    input, select, textarea { width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: white; outline: none; box-sizing: border-box; border-radius: 4px; }
    .hidden { display: none !important; }
    .btn-submit { width: 100%; background: #ff69b4; color: black; border: none; padding: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
    .btn-email { display: block; width: 100%; background: #333; color: #ff69b4; border: 1px solid #ff69b4; text-align: center; padding: 15px; text-decoration: none; font-weight: 600; margin-top: 20px; border-radius: 4px; }
    .payment-area { text-align: center; display: none; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">U&T ✨</a>
  <a href="index.html" style="color:white; text-decoration:none; font-size:12px; border: 1px solid #333; padding: 5px 10px;">BACK TO HOME</a>
</nav>

<div class="form-container">
  <div id="form-ui">
    <h1>Tailored Request</h1>
    <form id="orderForm">
      <input type="hidden" name="access_key" value="e8034fbc-90eb-4224-aa25-70c2cc28425b">
      
      <div class="form-group">
        <label>What are we creating?</label>
        <select name="Service" id="serviceSelect" required>
          <option value="">-- Choose Option --</option>
          <option value="shirts">Custom T-Shirts</option>
          <option value="baskets">Custom Baskets</option>
          <option value="keychains">Custom Keychains</option>
          <option value="fans">Graduation Fans</option>
          <option value="cups">Custom Cups</option>
          <option value="planning">Event Planning</option>
        </select>
      </div>

      <div class="form-group"><label>Your Name</label><input type="text" name="Name" required></div>
      <div class="form-group"><label>Phone Number</label><input type="tel" name="Phone" required></div>

      <div id="productFields" class="hidden">
        <div class="form-group"><label>Estimated Quantity</label><input type="number" name="Quantity" min="1"></div>
      </div>

      <div id="dateTimeFields" class="hidden">
        <div class="form-group"><label id="dateLabel">Date</label><input type="date" name="Date" id="mainDate"></div>
        <div class="form-group"><label>Time</label><select name="Time"><option value="17:00">5:00 PM</option><option value="17:30">5:30 PM</option><option value="18:00">6:00 PM</option><option value="18:30">6:30 PM</option><option value="19:00">7:00 PM</option><option value="19:30">7:30 PM</option></select></div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Submit Request</button>
    </form>
  </div>

  <div id="success-ui" class="payment-area">
    <h1 style="color: #4CAF50;">Request Received! 🎉</h1>
    <p>Thanks! Michelle will reach out within 24 hours.</p>
    <p><strong>Want to send reference photos? Please add the same name on your request to the subject line!</strong></p>
    <a href="mailto:uniqueandtailoreddesigns@aol.com?subject=Reference%20Photos%20for%20My%20Order" class="btn-email">Email Reference Photos</a>
    <a href="index.html" style="display:block; margin-top:30px; color:#ff69b4;">Return Home</a>
  </div>
</div>

<script>
  const form = document.getElementById('orderForm');
  const select = document.getElementById('serviceSelect');
  const mainDate = document.getElementById('mainDate');

  mainDate.setAttribute('min', new Date().toISOString().split('T')[0]);

  select.addEventListener('change', function() {
    const isPlanning = this.value === 'planning';
    document.getElementById('dateTimeFields').classList.toggle('hidden', !this.value);
    document.getElementById('productFields').classList.toggle('hidden', (isPlanning || this.value === ''));
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.innerText = "Processing...";
    
    const res = await fetch("https://api.web3forms.com/submit", { 
        method: "POST", 
        body: new FormData(form) 
    });
    
    if (res.ok) {
      document.getElementById('form-ui').style.display = 'none';
      document.getElementById('success-ui').style.display = 'block';
    } else {
      alert("Something went wrong. Please try again.");
      btn.innerText = "Submit Request";
    }
  };
</script>
</body>
</html>
