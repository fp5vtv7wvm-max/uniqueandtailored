<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Form | Unique & Tailored</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #050505; color: white; margin: 0; padding-bottom: 100px; }
    .navbar { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,105,180,0.2); }
    .logo { font-family: 'Playfair Display', serif; color: #ff69b4; text-decoration: none; font-size: 22px; }

    .form-container { max-width: 600px; margin: 60px auto; padding: 20px; }
    h1 { font-family: 'Playfair Display', serif; color: #ff69b4; font-size: 40px; text-align: center; }
    
    .form-group { margin-bottom: 25px; }
    label { display: block; color: #ff69b4; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    
    input, select, textarea { 
      width: 100%; padding: 15px; background: #111; border: 1px solid #333; color: white; outline: none; box-sizing: border-box;
    }
    input:focus { border-color: #ff69b4; }
    
    .hidden { display: none !important; }
    
    .btn-submit { 
      width: 100%; background: #ff69b4; color: black; border: none; padding: 18px; 
      font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
     footer { text-align: center; padding: 40px; color: #555; font-size: 13px; border-top: 1px solid #111; }
  
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">U&T ✨</a>
  <a href="index.html" style="color:white; text-decoration:none; font-size:12px;">BACK TO HOME</a>
</nav>

<div class="form-container">
  <h1>Tailored Request</h1>
  <p style="text-align:center; color:#888; margin-bottom:40px;">Tell us what you're looking for.</p>

  <form action="https://formsubmit.co/jameshiargross@gmail.com" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="_next" value="https://yourdomain.com/submit.html">

    <div class="form-group">
      <label>What are we creating?</label>
      <select name="Service" id="serviceSelect" required>
        <option value="">-- Choose Option --</option>
        <option value="shirts">Custom T-Shirts</option>
        <option value="cups">Custom Cups</option>
        <option value="planning">Event Planning</option>
      </select>
    </div>

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" name="Name" required>
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" name="Phone" required>
    </div>

    <!-- Logic Fields for Products (Shirts/Cups) -->
    <div id="productFields" class="hidden">
      <div class="form-group">
        <label>Estimated Quantity</label>
        <input type="number" name="Quantity" min="1">
      </div>
      <div class="form-group">
        <label>Upload Inspiration/Logo</label>
        <input type="file" name="Attachment" accept="image/*">
      </div>
    </div>

    <!-- Date and Time (Now shown for every selection) -->
    <div id="dateTimeFields" class="hidden">
      <div class="form-group">
        <label id="dateLabel">Preferred Date</label>
        <input type="date" name="Requested_Date" id="mainDate" required>
      </div>
      <div class="form-group">
        <label id="timeLabel">Preferred Time (EST: 5:00 PM - 8:30 PM)</label>
        <select name="Requested_Time">
          <option value="17:00">5:00 PM</option>
          <option value="17:30">5:30 PM</option>
          <option value="18:00">6:00 PM</option>
          <option value="18:30">6:30 PM</option>
          <option value="19:00">7:00 PM</option>
          <option value="19:30">7:30 PM</option>
          <option value="20:00">8:00 PM</option>
          <option value="20:30">8:30 PM</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Additional Notes</label>
      <textarea name="Notes" rows="4" placeholder="Tell us more about your vision..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Submit Request</button>
  </form>
</div>
 <footer>
    &copy; 2026 Unique & Tailored. <br> Youngstown, OH | Elite Event Design & Custom Apparel
  </footer>

<script>
  const select = document.getElementById('serviceSelect');
  const prodF = document.getElementById('productFields');
  const dateT = document.getElementById('dateTimeFields');
  const dateLabel = document.getElementById('dateLabel');
  const timeLabel = document.getElementById('timeLabel');

  // Set today as minimum date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('mainDate').setAttribute('min', today);

  select.addEventListener('change', function() {
    const val = this.value;

    if(val) {
      dateT.classList.remove('hidden');
      
      // Update labels based on selection for better UX
      if(val === 'shirts' || val === 'cups') {
        prodF.classList.remove('hidden');
        dateLabel.innerText = "Required Delivery/Pickup Date";
        timeLabel.innerText = "Preferred Pickup/Contact Time";
      } else {
        prodF.classList.add('hidden');
        dateLabel.innerText = "Preferred Consultation Date";
        timeLabel.innerText = "Preferred Consultation Time (5:00 PM - 8:30 PM)";
      }
    } else {
      dateT.classList.add('hidden');
      prodF.classList.add('hidden');
    }
  });

  window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const service = params.get('service');
    if(service) {
      select.value = service;
      select.dispatchEvent(new Event('change'));
    }
  };
</script>

</body>
</html>
